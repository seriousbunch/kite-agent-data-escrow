<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#121124"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b38"/>
      <stop offset="100%" stop-color="#110e24"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="url(#bg)" rx="16"/>

  <text x="480" y="48" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="1">KITE AGENT DATA ESCROW (KADE)</text>
  <text x="480" y="74" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Decentralized Dataset Annotation Escrow &amp; x402 Micropayments on Kite Chain (EIP-155: 2366/2368)</text>

  <!-- 3 Columns -->
  <rect x="40" y="110" width="260" height="310" rx="12" fill="url(#panelGrad)" stroke="#382e66" stroke-width="1.5"/>
  <rect x="40" y="110" width="260" height="40" rx="12" fill="#2d2254"/>
  <text x="170" y="136" fill="#00F0FF" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">1. Task Creator (Buyer)</text>

  <rect x="60" y="170" width="220" height="60" rx="8" fill="#140f2b" stroke="#4c3d82" stroke-width="1"/>
  <text x="170" y="196" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Dataset Annotation Task</text>
  <text x="170" y="216" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Define Quality Metrics &amp; Budget</text>

  <rect x="60" y="250" width="220" height="60" rx="8" fill="#140f2b" stroke="#4c3d82" stroke-width="1"/>
  <text x="170" y="276" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Lock Collateral</text>
  <text x="170" y="296" fill="#A78BFA" font-family="sans-serif" font-size="11" text-anchor="middle">Deposit to Kite Escrow</text>

  <rect x="60" y="330" width="220" height="65" rx="8" fill="#140f2b" stroke="#4c3d82" stroke-width="1"/>
  <text x="170" y="356" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Release Milestone</text>
  <text x="170" y="378" fill="#00F0FF" font-family="sans-serif" font-size="11" text-anchor="middle">Automated Payout Trigger</text>

  <!-- 2. On-Chain Escrow -->
  <rect x="350" y="110" width="260" height="310" rx="12" fill="url(#panelGrad)" stroke="#00F0FF" stroke-width="2"/>
  <rect x="350" y="110" width="260" height="40" rx="12" fill="#0e2a3b"/>
  <text x="480" y="136" fill="#38BDF8" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">2. Kite Chain Escrow Vault</text>

  <rect x="370" y="170" width="220" height="60" rx="8" fill="#0b1b26" stroke="#0284c7" stroke-width="1"/>
  <text x="480" y="196" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">createTask()</text>
  <text x="480" y="216" fill="#7DD3FC" font-family="sans-serif" font-size="11" text-anchor="middle">Bonded Task Deposit Vault</text>

  <rect x="370" y="250" width="220" height="60" rx="8" fill="#0b1b26" stroke="#0284c7" stroke-width="1"/>
  <text x="480" y="276" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">submitProof()</text>
  <text x="480" y="296" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="middle">IPFS Dataset Quality Check</text>

  <rect x="370" y="330" width="220" height="65" rx="8" fill="#0b1b26" stroke="#0284c7" stroke-width="1"/>
  <text x="480" y="356" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">releaseReward()</text>
  <text x="480" y="378" fill="#14F195" font-family="sans-serif" font-size="11" text-anchor="middle">Direct Payout to Worker</text>

  <!-- 3. Worker Agent -->
  <rect x="660" y="110" width="260" height="310" rx="12" fill="url(#panelGrad)" stroke="#382e66" stroke-width="1.5"/>
  <rect x="660" y="110" width="260" height="40" rx="12" fill="#2d2254"/>
  <text x="790" y="136" fill="#A78BFA" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">3. AI Annotator Agent</text>

  <rect x="680" y="170" width="220" height="60" rx="8" fill="#140f2b" stroke="#4c3d82" stroke-width="1"/>
  <text x="790" y="196" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Perform Annotation</text>
  <text x="790" y="216" fill="#C4B5FD" font-family="sans-serif" font-size="11" text-anchor="middle">Multi-Modal Labeling Pipeline</text>

  <rect x="680" y="250" width="220" height="60" rx="8" fill="#140f2b" stroke="#4c3d82" stroke-width="1"/>
  <text x="790" y="276" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Generate Proof</text>
  <text x="790" y="296" fill="#C4B5FD" font-family="sans-serif" font-size="11" text-anchor="middle">IPFS CID &amp; Quality Metrics</text>

  <rect x="680" y="330" width="220" height="65" rx="8" fill="#140f2b" stroke="#4c3d82" stroke-width="1"/>
  <text x="790" y="356" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Claim x402 Payment</text>
  <text x="790" y="378" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="middle">Zero Friction Reward Receipt</text>

  <path d="M 300 200 L 350 200" stroke="#00F0FF" stroke-width="2" stroke-dasharray="4"/>
  <path d="M 610 200 L 660 200" stroke="#A78BFA" stroke-width="2" stroke-dasharray="4"/>
</svg>
